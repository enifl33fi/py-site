name: prod

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: prod
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build.yml

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-github
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-helios-prod:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-helios
          path: site

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.HELIOS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HELIOS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to Helios
        env:
          HOST: ${{ secrets.HELIOS_HOST }}
          USER: ${{ secrets.HELIOS_USER }}
          PORT: ${{ secrets.HELIOS_PORT }}
          BASE: ${{ secrets.HELIOS_PATH }}
        run: |
          TS=$(date +%Y%m%d%H%M%S)
          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -p $PORT -o IdentitiesOnly=yes"
          ssh $SSH_OPTS "$USER@$HOST" "mkdir -p '$BASE/releases/$TS'"
          rsync -az --delete -e "ssh $SSH_OPTS" \
            site/ "$USER@$HOST:$BASE/releases/$TS/"
          ssh $SSH_OPTS "$USER@$HOST" \
            "rm -f '$BASE/current' && ln -s '$BASE/releases/$TS' '$BASE/current'"

      - name: Healthcheck
        env:
          URL: ${{ secrets.HELIOS_URL }}
        run: |
          code=$(curl -s -o /tmp/health.html -w '%{http_code}' "$URL/current/health.txt")
          echo "HTTP $code"
          test "$code" = "200"
          grep -q "P4_DEPLOY_OK" /tmp/health.html